<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Lieber Ajvar als kei Waar</title>
    <style>
      :root {
        --navy: #20304a;
        --gray: #d6dce8;
        --bg: #f2f4f8;
        --text: #333d4d;
        --muted: #6a7890;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.6;
      }
      .wrap {
        max-width: 600px;
        margin: 24px auto;
        background: #fff;
      }
      header {
        padding: 32px 36px 24px;
        border-bottom: 1px solid var(--gray);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
        color: var(--navy);
      }
      .tagline {
        margin: 8px 0 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        color: var(--muted);
      }
      main { padding: 8px 0; }
      .issue {
        display: block;
        padding: 28px 36px;
        text-decoration: none;
        color: inherit;
      }
      .issue:nth-child(even) { background: var(--gray); }
      .issue img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        margin-bottom: 16px;
      }
      .date {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h2 {
        margin: 4px 0 6px;
        font-size: 22px;
        color: var(--navy);
      }
      .issue p { margin: 0 0 10px; }
      .more {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        color: var(--navy);
        border-bottom: 1px solid var(--navy);
      }
      .issue:hover h2 { text-decoration: underline; }
      .issue:focus-visible { outline: 3px solid var(--navy); outline-offset: -3px; }
      footer {
        background: var(--navy);
        color: #fff;
        padding: 20px 36px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 620px) {
        .wrap { margin: 0; }
        header, .issue, footer { padding-left: 20px; padding-right: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Lieber Ajvar als kei Waar</h1>
        <p class="tagline">Der Newsletter – alle Ausgaben</p>
      </header>

      <main>
        <!-- Newest issue first. Copy a block to add a new issue; colors alternate automatically. -->
        <a class="issue" href="october/">
          <img src="october/img/a01_bovilla_see.jpg" alt="Bovilla-See in Albanien" />
          <div class="date">Oktober 2026</div>
          <h2>Montenegro, Peaks of the Balkans &amp; Tirana</h2>
          <p>Berge, Grenzen, Welpen und weiterhin genug Ajvar.</p>
          <span class="more">Ausgabe lesen →</span>
        </a>

        <a class="issue" href="september/">
          <img src="september/img/kroatien14.jpeg" alt="Kroatien" />
          <div class="date">September 2026</div>
          <h2>Kroatien &amp; Blagaj</h2>
          <p>Küste, Meer und die Quelle der Buna.</p>
          <span class="more">Ausgabe lesen →</span>
        </a>
      </main>

      <footer>Lieber Ajvar als kei Waar</footer>
    </div>
  </body>
</html>
